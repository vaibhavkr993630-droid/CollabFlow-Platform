services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: collabflow
      POSTGRES_PASSWORD: collabflow
      POSTGRES_DB: collabflow
    ports:
      # Loopback only: dev-default credentials must not be reachable from other machines.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collabflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  maildev:
    image: maildev/maildev:2.1.0
    ports:
      - "127.0.0.1:1080:1080" # web UI — view sent mail at http://localhost:1080
      - "127.0.0.1:1025:1025" # SMTP — no credentials needed, catches everything
    # The image's own baked-in HEALTHCHECK does `wget localhost:1080`, which
    # resolves "localhost" to ::1 first and fails — the server only listens on
    # 0.0.0.0, not ::1. Cosmetic (nothing here depends on maildev being
    # "healthy"; email sending works regardless — verified via a live worker
    # run), but disabling it keeps `docker ps` from reporting a false negative.
    healthcheck:
      disable: true

  minio:
    # Chainguard's free build of MinIO. MinIO's own images are gone: Docker Hub stopped
    # serving minio/minio, and quay.io/minio/minio now requires a login (401). Chainguard
    # only offers :latest for free, so this tag can move; same MinIO server binary.
    image: cgr.dev/chainguard/minio:latest
    # Root, as the old image ran: volumes created by the old image are root-owned, and this
    # image's default non-root user cannot write to them ("file access denied").
    user: "0:0"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: collabflow
      MINIO_ROOT_PASSWORD: collabflow123
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      # The image has no curl; MinIO's own client reports when the server is ready.
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot: applies migrations, then exits. `backend` waits on this exiting 0
  # rather than racing schema setup against serving its first request.
  migrate:
    build: ./backend
    command: alembic upgrade head
    environment: &backend_env
      DATABASE_URL: postgresql+asyncpg://collabflow:collabflow@postgres:5432/collabflow
      REDIS_URL: redis://redis:6379/0
      SMTP_HOST: maildev
      SMTP_PORT: "1025"
      S3_ENDPOINT_URL: http://minio:9000
      # Presigned URLs are handed to external clients (a browser, curl from the
      # host) that can't resolve "minio" — see storage.get_presign_client's
      # docstring. This must be reachable from wherever the client actually is,
      # not from inside the Compose network.
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY: collabflow
      S3_SECRET_KEY: collabflow123
      JWT_SECRET_KEY: change-me-in-production
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: ./backend
    environment: *backend_env
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build: ./backend
    command: celery -A app.workers.celery_app worker --loglevel=info
    environment: *backend_env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  beat:
    build: ./backend
    command: celery -A app.workers.celery_app beat --loglevel=info
    environment: *backend_env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
