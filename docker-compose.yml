services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: collabflow
      POSTGRES_PASSWORD: collabflow
      POSTGRES_DB: collabflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collabflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  maildev:
    image: maildev/maildev:2.1.0
    ports:
      - "1080:1080" # web UI — view sent mail at http://localhost:1080
      - "1025:1025" # SMTP — no credentials needed, catches everything

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: collabflow
      MINIO_ROOT_PASSWORD: collabflow123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
