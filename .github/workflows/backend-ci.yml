name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: collabflow
          POSTGRES_PASSWORD: collabflow
          POSTGRES_DB: collabflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collabflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://collabflow:collabflow@localhost:5432/collabflow
      TEST_DATABASE_URL: postgresql+asyncpg://collabflow:collabflow@localhost:5432/collabflow_test
      REDIS_URL: redis://localhost:6379/0
      S3_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY: collabflow
      S3_SECRET_KEY: collabflow123
      JWT_SECRET_KEY: ci-test-secret-not-for-production

    steps:
      - uses: actions/checkout@v4

      - name: Start MinIO
        # Not a "services:" container: those can't override the image's command,
        # and the official minio/minio image needs `server /data` as an argument
        # to actually start the server (its bare default CMD just prints usage
        # and exits) - GitHub Actions' service-container config has no field for
        # that. Starting it directly with `docker run` sidesteps the limitation.
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=collabflow \
            -e MINIO_ROOT_PASSWORD=collabflow123 \
            minio/minio:latest server /data
          for i in $(seq 1 20); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 1
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check app tests migrations

      - name: Create test database
        run: |
          PGPASSWORD=collabflow psql -h localhost -U collabflow -d collabflow \
            -c "CREATE DATABASE collabflow_test;"

      - name: Apply migrations
        # Runs against the (non-test) DATABASE_URL. This is a real regression
        # check, not a formality: several bugs in this project only ever showed
        # up when a migration ran for real against Postgres (enum value vs. name
        # mismatches, a migration that tried to create the same Postgres enum
        # type twice) - the pytest suite's schema is built via
        # Base.metadata.create_all in tests/conftest.py, which is generated
        # fresh from the current models every time and so cannot catch drift
        # between a hand-maintained migration file and the models it's meant
        # to reproduce. See PROGRESS.md's Phase 1/2 bug lists for the specifics.
        run: alembic upgrade head

      - name: Run tests
        run: pytest -v
