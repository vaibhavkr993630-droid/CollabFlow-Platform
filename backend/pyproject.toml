[project]
name = "collabflow-backend"
version = "0.1.0"
description = "CollabFlow backend — real-time collaboration & project management platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<4.1",  # passlib 1.7.4's backend self-test breaks on bcrypt>=4.1's strict 72-byte limit
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.12",  # OAuth2PasswordBearer's tokenUrl form / future file uploads
    "redis>=5.2",                # pub/sub (Phase 4) and now the Celery broker/backend
    "celery>=5.4",                # background email delivery + the daily due-soon reminder
    "boto3>=1.35",                # S3-compatible client for MinIO attachment storage
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "ruff>=0.7",
    "websockets>=13",  # starlette.testclient's websocket_connect() uses this under the hood
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "B", "UP", "RUF"]
ignore = ["B008"]  # Depends()/Path() in defaults is the standard FastAPI DI pattern
